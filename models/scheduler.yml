name: "scheduler" 
root:
  !!FolderNode
  name: "Scheduler"
  description: ""
  children:
    - !!FolderNode
      name: "Status"
      children:
        - !!StringVariableNode
          name: "current_task"
          initial_value: "IDLE"
        - !!NumericalVariableNode
          name: "queue_length"
          initial_value: 0
    - !!CompositeMethodNode
      name: "StartTask"
      parameters: 
        - !!StringVariableNode
          name: "remote_machine"
        - !!StringVariableNode
          name: "remote_method"
        - !!NumericalVariableNode
          name: "tray_id"
          initial_value: 0
      cfg:
        - !!CallRemoteMethodNode
          method: "${remote_method}"
          remote_id: "${remote_machine}"
          kwargs:
            tray_id: "${tray_id}"
        - !!WaitRemoteEventNode
          variable: "/Machine/Status/Busy"
          remote_id: "${remote_machine}"
          rhs: false
          operator: "=="